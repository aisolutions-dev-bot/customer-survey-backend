name: Build & Deploy Preview

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/bcidev25/customer-survey-backend
  IMAGE_TAG: ${{ github.sha }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_ACTOR: BCIDev25
      GITHUB_TOKEN: ${{ secrets.GHCR_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Run quality gates and tests
        run: ./gradlew spotlessCheck checkstyleMain checkstyleTest pmdMain pmdTest test jacocoTestReport --no-daemon

  build:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build native image
        env:
          GITHUB_ACTOR: BCIDev25
          GITHUB_TOKEN: ${{ secrets.GHCR_PAT }}
        run: |
          docker buildx build \
            --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" \
            --secret id=github_token,env=GITHUB_TOKEN \
            --tag "${{ env.IMAGE }}:${{ env.IMAGE_TAG }}" \
            --tag "${{ env.IMAGE }}:latest" \
            --load \
            .

      - name: Verify native notification delivery
        env:
          GITHUB_ACTOR: BCIDev25
          GITHUB_TOKEN: ${{ secrets.GHCR_PAT }}
          CUSTOMER_SURVEY_NATIVE_IMAGE: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
        run: ./gradlew nativeE2eTest --no-daemon

      - name: Push verified native image
        env:
          IMAGE: ${{ env.IMAGE }}
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  deploy:
    runs-on: [self-hosted, preview-vps]
    needs: build
    steps:
      - name: Login to GHCR
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u BCIDev25 --password-stdin

      - name: Pull new image
        run: docker pull ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Deploy on VPS
        working-directory: /home/ubuntu/deploy/preview
        run: IMAGE_TAG=${{ env.IMAGE_TAG }} docker compose -f customer-survey-backend.preview.yml up -d

      # The app binds 8090 inside the container; the preview compose publishes it
      # on 8095 because 8090 is already taken on the host.
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if timeout 2 bash -c '</dev/tcp/127.0.0.1/8095' 2>/dev/null; then
              echo "HEALTHY"; exit 0
            fi
            sleep 10
          done
          IMAGE_TAG=${{ env.IMAGE_TAG }} docker compose -f /home/ubuntu/deploy/preview/customer-survey-backend.preview.yml ps
          docker logs --tail 50 customer-survey-backend-preview || true
          exit 1
