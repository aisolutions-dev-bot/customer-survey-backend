name: Build & Deploy Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/bcidev25/customer-survey-backend
  IMAGE_TAG: ${{ github.sha }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GHCR_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Run quality gates and tests
        run: GITHUB_ACTOR=BCIDev25 ./gradlew spotlessCheck checkstyleMain checkstyleTest pmdMain pmdTest test jacocoTestReport --no-daemon

  build:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native image
        uses: docker/build-push-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GHCR_PAT }}
        with:
          context: .
          file: Dockerfile.native
          load: true
          push: false
          tags: |
            ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE }}:latest
          build-args: |
            GITHUB_ACTOR=BCIDev25
          secret-envs: |
            id=github_token,env=GITHUB_TOKEN
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify native notification delivery
        env:
          GITHUB_TOKEN: ${{ secrets.GHCR_PAT }}
          CUSTOMER_SURVEY_NATIVE_IMAGE: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
        run: GITHUB_ACTOR=BCIDev25 ./gradlew nativeE2eTest --no-daemon

      - name: Push verified native image
        run: |
          docker push ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.IMAGE }}:latest

  deploy:
    runs-on: [self-hosted, preview-vps]
    needs: build
    steps:
      - name: Login to GHCR
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u BCIDev25 --password-stdin

      - name: Pull new image
        run: docker pull ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Deploy on VPS
        working-directory: /home/ubuntu/deploy/preview
        run: IMAGE_TAG=${{ env.IMAGE_TAG }} docker compose -f customer-survey-backend.preview.yml up -d

      # The app binds 8090 inside the container; the preview compose publishes it
      # on 8095 because 8090 is already taken on the host.
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if timeout 2 bash -c '</dev/tcp/127.0.0.1/8095' 2>/dev/null; then
              echo "HEALTHY"; exit 0
            fi
            sleep 10
          done
          IMAGE_TAG=${{ env.IMAGE_TAG }} docker compose -f /home/ubuntu/deploy/preview/customer-survey-backend.preview.yml ps
          docker logs --tail 50 customer-survey-backend-preview || true
          exit 1
