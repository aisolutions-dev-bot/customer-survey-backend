name: Build & Deploy Preview

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/bcidev25/customer-survey-backend
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Spring Boot fat JAR, not a native image. ai-solutions-java-shared comes
      # from GitHub Packages, so the build args are required or Gradle cannot
      # resolve it.
      - name: Build image
        run: docker build --build-arg GITHUB_ACTOR=BCIDev25 --build-arg GITHUB_TOKEN=${{ secrets.GHCR_PAT }} -t ${{ env.IMAGE }}:${{ env.IMAGE_TAG }} -t ${{ env.IMAGE }}:latest .

      - name: Push
        run: |
          docker push ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.IMAGE }}:latest

  deploy:
    runs-on: [self-hosted, preview-vps]
    needs: build
    steps:
      - name: Login to GHCR
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u BCIDev25 --password-stdin

      - name: Pull new image
        run: docker pull ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Deploy on VPS
        working-directory: /home/ubuntu/deploy/preview
        run: IMAGE_TAG=${{ env.IMAGE_TAG }} docker compose -f customer-survey-backend.preview.yml up -d

      # The app binds 8090 inside the container; the preview compose publishes it
      # on 8095 because 8090 is already taken on the host.
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if timeout 2 bash -c '</dev/tcp/127.0.0.1/8095' 2>/dev/null; then
              echo "HEALTHY"; exit 0
            fi
            sleep 10
          done
          IMAGE_TAG=${{ env.IMAGE_TAG }} docker compose -f /home/ubuntu/deploy/preview/customer-survey-backend.preview.yml ps
          docker logs --tail 50 customer-survey-backend-preview || true
          exit 1
