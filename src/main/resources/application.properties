# Database Configuration
spring.application.name=customer-survey-backend
spring.datasource.url=${DB_URL:jdbc:mysql://borneochemicalintl.com:3306/db_test2?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Singapore}
spring.datasource.username=${DB_USERNAME:db_test2}
spring.datasource.password=${DB_PASSWORD:DB12*test34}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# IMPORTANT: Force Hibernate to use the exact table/column names (case-sensitive)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl

# Server Port 
server.port=8090

# CORS Configuration
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:4200},${CORS_ORIGIN2:https://customer-survey-production.up.railway.app}

# Data Migration Flags (set to true for one-time execution)
migration.recalculate-carpenter-scores=false
migration.populate-carpenter-formtype=false

# Organization API — system parameter flags (email/sms/whatsapp enabled) + service auth
org.api.base-url=${ORG_SERVICE_URL:http://localhost:8080}
app.service.username=${SERVICE_ACCOUNT_USERNAME:}
app.service.password=${SERVICE_ACCOUNT_PASSWORD:}
org.api.connect-timeout=${ORG_API_CONNECT_TIMEOUT:PT2S}
org.api.read-timeout=${ORG_API_READ_TIMEOUT:PT5S}

# Tenant routing. pool-cache.max-size bounds how many company pools hold
# connections at once; each pool clones the default pool size, so lower
# spring.datasource.hikari.maximum-pool-size before raising this bound.
aisolutions.tenancy.pool-cache.max-size=${TENANT_POOL_CACHE_MAX_SIZE:5}
aisolutions.tenancy.pool-cache.idle-eviction-minutes=${TENANT_POOL_CACHE_IDLE_EVICTION_MINUTES:15}
aisolutions.tenancy.company-db-cache.ttl-seconds=${COMPANY_DB_CACHE_TTL_SECONDS:120}

# Spring shared outbox integration. Delivery requests join the business transaction,
# then the shared relay publishes them to Notification Management's Kafka topics.
# Notification requests commit with business data and publish through the shared relay.
notification.outbox.enabled=true
notification.outbox.table=customer_survey_notification_outbox
notification.outbox.poll-interval-milliseconds=${NOTIFICATION_OUTBOX_POLL_INTERVAL_MILLISECONDS:1000}
notification.outbox.batch-size=${NOTIFICATION_OUTBOX_BATCH_SIZE:100}
notification.outbox.maximum-attempts=${NOTIFICATION_OUTBOX_MAXIMUM_ATTEMPTS:5}
notification.outbox.publish-timeout-seconds=${NOTIFICATION_OUTBOX_PUBLISH_TIMEOUT_SECONDS:10}
notification.outbox.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
notification.outbox.topic.email=notifications.email.v1
notification.outbox.topic.sms=notifications.sms.v1
notification.outbox.topic.whatsapp=notifications.whatsapp.v1
